name: acadintern_student_mobile
description: Native-first Flutter student app for AcadIntern.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  app_links: ^6.3.2
  dio: ^5.7.0
  file_picker: ^8.1.2
  flutter_file_dialog: ^3.0.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.1.0
  go_router: ^14.2.8
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  socket_io_client: ^3.0.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.3.1
  sqflite: ^2.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/app_icon.png
  android: true
  ios: true
  android_12:
    image: assets/icons/app_icon.png
    color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/google_logo.svg
