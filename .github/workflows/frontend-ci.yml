name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'



jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint

    - name: Build Next.js App
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    needs: build-and-lint
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t acadintern-frontend .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Vercel Deploy
        env:
          DEPLOY_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set. Skipping deployment."
            exit 0
          fi
          curl "$DEPLOY_URL"
